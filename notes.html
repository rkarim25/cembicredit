<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intelligence & Annotations Vault | CEMBI Credit Master Platform</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/issuers_data.js"></script>
  <script src="js/app.js"></script>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">CEMBI</div>
      <div>
        <div class="brand-title">Intelligence &amp; Annotations Vault</div>
        <div class="brand-subtitle">Qualitative Footnotes, Cognitive Credit Adjustments &amp; Broker Consensus</div>
      </div>
    </div>
    <nav>
      <a href="index.html" class="nav-link">Comp Sheet & Screener</a>
      <a href="trends.html" class="nav-link">Zero-AI Trends</a>
      <a href="notes.html" class="nav-link active">Intelligence Footnotes</a>
      <a href="https://raw.githubusercontent.com/rkarim25/cembicredit/main/models/CEMBI_Master_Comp_Sheet.xlsx" class="btn-action btn-primary" download>
        📊 Master Comp Sheet (.xlsx)
      </a>
      <a href="https://github.com/rkarim25/cembicredit" class="btn-action" target="_blank">
        GitHub Repo
      </a>
    </nav>
  </header>

  <div class="container">

    <div class="filter-card">
      <div class="filter-group">
        <input type="text" id="note-search" class="filter-input" placeholder="Search keywords (e.g. escrow, YEKDEM, fertilizer, restructuring)..." style="min-width:320px;">
        <select id="note-source-select" class="filter-input">
          <option value="">All Sources</option>
          <option value="Cognitive Credit">Cognitive Credit</option>
          <option value="Arqaam">Arqaam Capital</option>
          <option value="J.P. Morgan">J.P. Morgan</option>
          <option value="Citi">Citi Research</option>
          <option value="Morgan Stanley">Morgan Stanley</option>
          <option value="Company Filings">Company Filings</option>
          <option value="Regulatory">Regulatory / Central Bank</option>
        </select>
      </div>
      <div id="notes-count" style="font-size:12px; color:var(--text-dim); font-weight:600;">--</div>
    </div>

    <!-- Notes Cards Grid -->
    <div id="notes-container" class="notes-grid">
      <!-- Populated dynamically -->
    </div>

  </div>

</body>
</html>
